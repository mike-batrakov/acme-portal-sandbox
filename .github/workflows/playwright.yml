name: playwright

# Post-deploy playwright check. Filename `playwright.yml` is the contract
# surface the orchestrator's router matches on to drive
# `deploying_dev -> playwright_running -> merged_and_deployed`. The router
# lives in a separate repo (`mike-batrakov/biztech_ai_orchestrator`,
# `infra/lib/router/event-mapper.ts`); search there for `'playwright'` to
# find the workflow-name match.
#
# The failure-injection step that used to live here was moved to ci.yml
# on 2026-05-22. The thin-slice failure-path variant needs the failure to
# happen BEFORE merge so the FSM goes `ci_running → ci_failed` (non-
# terminal, retried by the dispatcher), not after merge as
# `playwright_failed → escalated` (terminal, no retry). The runbook that
# documents this is in the orchestrator repo
# (`mike-batrakov/biztech_ai_orchestrator`, `docs/runbooks/thin-slice.md`,
# "Sandbox-repo CI workflow change" section).

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Playwright smoke (thin-slice no-op)
        run: echo "thin-slice playwright smoke passed for commit ${GITHUB_SHA}"
