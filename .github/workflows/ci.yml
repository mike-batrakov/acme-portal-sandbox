name: ci

# Pull-request CI gate for the thin-slice. Runs npm test on the worker's PR
# branch. The status reaches the orchestrator via the `check_suite` webhook
# (configured at the repo level — see docs/runbooks/thin-slice.md §1).

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
