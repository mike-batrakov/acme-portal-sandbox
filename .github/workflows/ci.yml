name: ci

# Pull-request CI gate for the thin-slice. Runs npm test on the worker's PR
# branch. The status reaches the orchestrator via the `check_suite` webhook
# (configured at the repo level — see docs/runbooks/thin-slice.md §1).
#
# The injection step lets the thin-slice failure-path variant
# (`scripts/run-thin-slice.sh run --inject-ci-failure`) force a CI failure
# on attempt 1 BEFORE merge. The orchestrator's dispatcher then bumps
# attempt_number and starts a fresh run; the driver clears the variable
# on observing `ci_failed`, so attempt 2 runs against clean CI and
# reaches `merged_and_deployed`. See docs/runbooks/thin-slice.md §6.

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Honor thin-slice failure-injection variable
        if: ${{ vars.THIN_SLICE_INJECT_FAILURE == 'true' }}
        run: |
          echo "THIN_SLICE_INJECT_FAILURE is set; injecting deliberate CI failure for attempt 1"
          exit 1

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
